<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept D — Set Stack</title><link rel="stylesheet" href="shared.css">
<style>
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
.tile .l { font-size: 9px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 20px; font-weight: 700; color: #fff; margin-top: 6px; letter-spacing: -.02em; }
.tile .s { font-size: 10px; color: var(--muted); margin-top: 3px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style></head><body>
<script src="shared.js"></script>
<script>
const { CYCLE, KIND, stats, delta, pct, signPct, sign, fmt } = PS;
PS.frame('Concept D', 'Set stack',
  'One lift, every set, every week. Each column is a stack of sets — taller means more total reps. Anything that is new since last week is coloured, so one extra rep is visible.');

let sel = 0;
const W = 342, H = 300, padL = 6, padR = 6, padT = 34, padB = 52;
const colW = (W - padL - padR) / CYCLE.totalWeeks, barW = 38, base = H - padB;

function render() {
  const m = CYCLE.movements[sel], last = CYCLE.currentWeek - 1;
  const maxReps = Math.max(...m.weeks.map(s => s.reduce((a, x) => a + x[1], 0)));
  const px = (base - padT - 14) / maxReps;
  let g = `<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" stroke="#2a2a2a"/>`;

  for (let i = 0; i < CYCLE.totalWeeks; i++) {
    const cx = padL + (i + .5) * colW, bx = cx - barW / 2, s = m.weeks[i], prev = m.weeks[i - 1], d = delta(m, i);
    const isNow = i === last;
    g += `<text x="${cx}" y="${base + 15}" fill="${isNow ? '#fff' : '#888'}" font-size="10" font-weight="${isNow ? 700 : 500}" text-anchor="middle">W${i + 1}</text>`;
    if (!s) {
      g += `<rect x="${bx}" y="${base - 52}" width="${barW}" height="52" rx="6" fill="none" stroke="#333" stroke-dasharray="3 4"/><text x="${cx}" y="${base - 24}" fill="#555" font-size="9.5" text-anchor="middle">deload</text>`;
      continue;
    }
    let yTop = base;
    s.forEach(([w, r], j) => {
      const p = prev && prev[j];
      const h = r * px - 2, yy = yTop - r * px;
      let carried = r, added = 0, whole = null;
      if (!prev) { whole = 'var(--hold)'; }
      else if (!p) { whole = 'var(--reps)'; }                       // a set that did not exist last week
      else if (w > p[0]) { whole = 'var(--load)'; }                 // heavier than the same set last week
      else if (w < p[0]) { whole = 'var(--down)'; }
      else if (r >= p[1]) { carried = p[1]; added = r - p[1]; }
      const tip = `<title>Week ${i + 1} · set ${j + 1}: ${w} lb × ${r}${p ? ' (last week ' + p[0] + ' × ' + p[1] + ')' : ''}</title>`;
      if (whole) g += `<rect x="${bx}" y="${yy}" width="${barW}" height="${h}" rx="4" fill="${whole}" opacity="${whole === 'var(--hold)' ? 1 : .92}">${tip}</rect>`;
      else {
        g += `<rect x="${bx}" y="${yy + added * px}" width="${barW}" height="${carried * px - 2}" rx="4" fill="#4a4a4a">${tip}</rect>`;
        if (added) g += `<rect x="${bx}" y="${yy}" width="${barW}" height="${added * px - 1}" rx="4" fill="var(--reps)">${tip}</rect>`;
      }
      if (p && w === p[0] && r < p[1]) {                              // reps lost: dashed ghost of what was there
        g += `<rect x="${bx}" y="${yy - (p[1] - r) * px}" width="${barW}" height="${(p[1] - r) * px - 2}" rx="4" fill="none" stroke="var(--down)" stroke-dasharray="3 3" stroke-width="1.3"/>`;
      }
      yTop -= r * px;
    });
    const total = s.reduce((a, x) => a + x[1], 0);
    const chipColor = d.kind === 'load' ? 'var(--load)' : d.kind === 'reps' ? 'var(--reps)' : d.kind === 'down' ? 'var(--down)' : '#777';
    g += `<text x="${cx}" y="${yTop - 8}" fill="${chipColor}" font-size="10.5" font-weight="700" text-anchor="middle">${d.kind === 'start' ? '' : (d.kind === 'reps' ? '' : KIND[d.kind].glyph + ' ') + d.text}</text>`;
    g += `<text x="${cx}" y="${base + 29}" fill="#ccc" font-size="10" text-anchor="middle" class="num">${s[0][0]}${s.some(x => x[0] !== s[0][0]) ? '+' : ''} lb</text>
          <text x="${cx}" y="${base + 42}" fill="#777" font-size="9.5" text-anchor="middle">${total} reps</text>`;
  }

  const a = stats(m, 0), b = stats(m, last);
  document.getElementById('app').innerHTML = `
    <div class="chips">${CYCLE.movements.map((x, k) => `<button class="chip" aria-pressed="${k === sel}" data-s="${k}">${x.short}</button>`).join('')}</div>
    <div class="card" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-weight:600;color:#fff">${m.name}</div><div style="font-size:11px;color:var(--muted)">${m.range[0]}–${m.range[1]} reps · ${m.weeks[0].length} sets</div></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:6px" role="img" aria-label="${m.name}: sets and reps by week">${g}</svg>
      <div class="legend">
        <span><i class="sw" style="background:#4a4a4a"></i>Same as last week</span>
        <span><i class="sw" style="background:var(--reps)"></i>Extra reps</span>
        <span><i class="sw" style="background:var(--load)"></i>Heavier</span>
        <span><i class="sw" style="background:transparent;border:1.3px dashed var(--down)"></i>Reps lost</span>
      </div></div>
    <div class="tiles">
      <div class="tile"><div class="l">Top weight</div><div class="v num">${b.top}</div><div class="s">${sign(b.top - a.top)} lb vs W1</div></div>
      <div class="tile"><div class="l">Total reps</div><div class="v num">${b.reps}</div><div class="s">${sign(b.reps - a.reps)} vs W1</div></div>
      <div class="tile"><div class="l">Est. 1RM</div><div class="v num">${fmt(b.e1rm)}</div><div class="s">${signPct(pct(a.e1rm, b.e1rm))} vs W1</div></div>
    </div>
    <p class="note">Each block is one set, bottom = set 1. Compared set-for-set with the previous week, so a single extra rep on set 3 shows up as a small green cap on that block.</p>`;
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { sel = +b.dataset.s; render(); });
}
render();
</script></body></html>
